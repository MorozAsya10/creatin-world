services:
  postgres:
    image: postgres:16-alpine
    container_name: creatin_world_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creatin_world
      POSTGRES_USER: creatin
      POSTGRES_PASSWORD: creatin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatin -d creatin_world"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
